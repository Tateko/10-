<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>michi</title>
<style>
  :root {
    --bg: #ece7de; --phone: #f7f4ee; --ink: #1d2b22; --sub: #6b7169; --line: #d9d3c8;
    --card: #fffdf9; --accent: #1f3d2b; --accent-ink: #f3efe8; --tag: #e6e0d4; --warn: #a23b2a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; line-height: 1.55; }
  /* スマホ枠。PCでも中央に端末サイズで表示する */
  .phone { max-width: 430px; min-height: 100dvh; margin: 0 auto; background: var(--phone);
    display: flex; flex-direction: column; position: relative; }
  @media (min-width: 480px) { .phone { min-height: 860px; height: 100dvh; box-shadow: 0 0 0 1px var(--line); } }
  main { flex: 1; overflow-y: auto; padding: 24px 20px 96px; }
  .date { color: var(--sub); font-size: 14px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  h1.hello { font-size: 40px; margin: 6px 0 18px; letter-spacing: .01em; font-weight: 700; }
  h1.hello small { display: block; font-size: 14px; color: var(--sub); font-weight: 400; margin-top: 2px; }
  h2.title { font-size: 20px; margin: 0 0 14px; }

  /* 大きな1枚カード（スケッチの吹き出し枠） */
  .big { background: var(--card); border: 1.5px solid var(--ink); border-radius: 22px 22px 22px 6px;
    padding: 20px 20px 18px; min-height: 380px; display: flex; flex-direction: column; gap: 10px; }
  .big .kicker { font-size: 12px; color: var(--sub); letter-spacing: .08em; }
  .big h3 { margin: 0; font-size: 24px; line-height: 1.3; }
  .big .meta { color: var(--sub); font-size: 13px; }
  .why { background: #f5f0e7; border-left: 3px solid var(--accent); padding: 8px 12px; font-size: 14px; border-radius: 0 8px 8px 0; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-size: 15px; margin: 4px 0 0; }
  .kv dt { color: var(--sub); font-size: 12px; padding-top: 3px; white-space: nowrap; }
  .kv dd { margin: 0; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: auto; padding-top: 8px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--ink); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; }
  .btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 14px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.block { width: 100%; padding: 14px; font-size: 16px; }
  .btn[disabled] { opacity: .55; cursor: progress; }
  .status { min-height: 1.4em; font-size: 13px; color: var(--sub); margin: 10px 2px 0; }
  .status.err { color: var(--warn); }

  /* フォーム */
  form { display: grid; gap: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--sub); }
  input, select, textarea { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
  textarea { min-height: 84px; resize: vertical; }

  /* オススメ一覧 */
  .cards { display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card h3 { margin: 0; font-size: 18px; }
  .tag { font-size: 11px; background: var(--tag); border-radius: 999px; padding: 2px 9px; color: var(--sub); white-space: nowrap; }
  .card.picked { border-color: var(--ink); border-width: 1.5px; }
  .empty { color: var(--sub); font-size: 14px; text-align: center; padding: 40px 12px; }

  /* 友達 */
  .friends { display: grid; gap: 8px; }
  .friend { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .friend .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--tag); display: grid; place-items: center; font-weight: 700; color: var(--accent); flex: none; }
  .friend .name { font-weight: 600; }
  .friend .last { font-size: 12px; color: var(--sub); }
  .friend .grow { flex: 1; min-width: 0; }
  .friend.today { border-color: var(--ink); border-width: 1.5px; }
  .friend .del { border: 0; background: none; color: var(--sub); font-size: 18px; padding: 4px; }
  .count { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .count b { font-size: 36px; }
  .count span { color: var(--sub); font-size: 13px; }
  .addrow { display: flex; gap: 8px; margin-top: 12px; }
  .addrow input { flex: 1; }

  /* 下部タブ（スケッチの4アイコン） */
  nav.tabs { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--phone); border-top: 1px solid var(--line); }
  nav.tabs button { border: 1.5px solid var(--ink); background: var(--card); border-radius: 14px; height: 56px; display: grid; place-items: center; gap: 0; color: var(--ink); position: relative; }
  nav.tabs button svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  nav.tabs button .lbl { position: absolute; bottom: -18px; font-size: 10px; color: var(--sub); letter-spacing: .04em; }
  nav.tabs button .badge { position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  section[hidden] { display: none; }

  /* ロック画面: 完了までアプリ全体を占有する */
  .lock { position: absolute; inset: 0; background: var(--accent); color: var(--accent-ink); display: flex; flex-direction: column;
    padding: 28px 24px calc(20px + env(safe-area-inset-bottom)); z-index: 10; }
  .lock[hidden] { display: none; }
  .lock .top { font-size: 12px; letter-spacing: .1em; opacity: .75; }
  .lock .timer { font-family: "Hiragino Mincho ProN", "Noto Serif JP", Georgia, serif; font-size: 84px; line-height: 1; margin: auto 0 4px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .lock .timer.over { font-size: 40px; line-height: 1.25; }
  .lock .cap { font-size: 13px; opacity: .75; margin-bottom: 28px; }
  .lock h3 { margin: 0 0 6px; font-size: 22px; line-height: 1.3; }
  .lock .step { font-size: 14px; opacity: .9; margin-bottom: 26px; }
  .lock .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); font-weight: 600; }
  .lock .btn.ghost { background: transparent; color: var(--accent-ink); border-color: rgba(243,239,232,.4); font-weight: 400; }
  .lock .quit { margin-top: 18px; text-align: center; font-size: 12px; opacity: .45; user-select: none; -webkit-user-select: none; }
  .lock .quit.arming { opacity: .9; }
  .report { background: var(--card); color: var(--ink); border-radius: 16px; padding: 16px; display: grid; gap: 10px; margin-bottom: 12px; }
  .report input[type=file] { font-size: 13px; padding: 8px; }
  .report img { max-width: 100%; border-radius: 10px; max-height: 180px; object-fit: cover; }

  /* 完了画面 */
  .done h1 { font-family: "Hiragino Mincho ProN", "Noto Serif JP", Georgia, serif; font-size: 40px; margin: 8px 0 0; }
  .done .sub { color: var(--sub); margin: 0 0 18px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; text-align: center; }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 11px; color: var(--sub); }
  .note { font-size: 12px; color: var(--sub); margin-top: 8px; }
</style>
</head>
<body>
<div class="phone">
<main>

  <!-- ホーム -->
  <section id="tab-home">
    <div class="date" id="today"></div>
    <h1 class="hello">Hello!<small id="helloSub">今日、自分では選ばない一手を。</small></h1>

    <div class="big" id="big">
      <!-- 提案が無いとき: 最小の入力 -->
      <div id="quick">
        <div class="kicker">今日の未知</div>
        <form id="quickForm">
          <label>いまいるエリア<input name="area" placeholder="例: 渋谷、名古屋駅、自宅" required></label>
          <div class="row">
            <label>使える時間
              <select name="minutes">
                <option value="30">30分</option><option value="60" selected>1時間</option>
                <option value="120">2時間</option><option value="180">3時間</option><option value="300">半日</option>
              </select></label>
            <label>気分
              <select name="mood">
                <option value="">特になし</option><option>疲れている</option><option>暇でだるい</option>
                <option>何か刺激がほしい</option><option>人と話したい</option><option>一人になりたい</option>
              </select></label>
          </div>
          <button class="btn primary block" id="go">今日の未知を提案する</button>
          <div class="note" id="quickNote"></div>
        </form>
      </div>
      <!-- 提案があるとき: 1案を大きく -->
      <div id="focus" hidden></div>
    </div>
    <div class="status" id="status"></div>
  </section>

  <!-- アナタへのオススメ -->
  <section id="tab-reco" hidden>
    <h2 class="title">アナタへのオススメ</h2>
    <div id="oneliner" class="note" style="font-size:15px;color:var(--ink);margin:0 0 12px"></div>
    <div class="cards" id="cards"><div class="empty">まだ提案がありません。ホームで「今日の未知を提案する」を押してください。</div></div>
  </section>

  <!-- 友達 -->
  <section id="tab-friends" hidden>
    <h2 class="title">友達</h2>
    <div class="count"><b id="friendCount">0</b><span>/ 100人 — リアルに会った人だけ数える</span></div>
    <div class="friends" id="friends"></div>
    <div class="addrow">
      <input id="newFriend" placeholder="名前を追加（例: 同期のA）">
      <button class="btn" id="addFriend">追加</button>
    </div>
    <div class="note">名前をタップすると「今日誘う人」になり、提案に反映されます。「会った」を押すと最後に会った日が更新されます。</div>
  </section>

  <!-- 設定 -->
  <section id="tab-settings" hidden>
    <h2 class="title">設定</h2>
    <form id="settingsForm">
      <label>呼び名（Hello! の後に表示）<input name="name" placeholder="例: たて"></label>
      <label>いつもの過ごし方・最近やったこと（「自分では選ばない」の根拠になります）
        <textarea name="recent" placeholder="例: 休日はだいたい家で動画。外に出るときは決まったカフェ。人と会うのは月1回くらい。"></textarea></label>
      <div class="row">
        <label>予算感
          <select name="budget">
            <option value="">こだわりなし</option><option>0円</option><option>〜1,000円</option><option>〜3,000円</option><option>〜10,000円</option>
          </select></label>
        <label>よくいるエリア<input name="homeArea" placeholder="例: 渋谷"></label>
      </div>
      <button class="btn primary" type="submit">保存</button>
    </form>
    <div class="note" id="mode"></div>
    <div class="note">データはこの端末（ブラウザ）にだけ保存されます。</div>
  </section>

  <!-- 完了 -->
  <section id="tab-done" class="done" hidden></section>

</main>

<!-- ロック: 「これにする」からイベント完了まで、この画面しか使えない -->
<div class="lock" id="lock" hidden>
  <div class="top">進行中 ・ <span id="lockDate"></span></div>
  <div class="timer" id="lockTimer">--:--</div>
  <div class="cap" id="lockCap">残り時間</div>
  <h3 id="lockTitle"></h3>
  <div class="step" id="lockStep"></div>
  <div class="report" id="report" hidden>
    <div style="font-size:13px;color:var(--sub)">完了の報告（写真は任意）</div>
    <input type="file" id="reportPhoto" accept="image/*" capture="environment">
    <img id="reportPreview" hidden alt="">
    <input id="reportNote" placeholder="一言（任意）">
    <div class="actions">
      <button class="btn primary" data-act="finish">完了にする</button>
      <button class="btn" data-act="report-cancel">戻る</button>
    </div>
  </div>
  <div class="actions" id="lockActions">
    <button class="btn block" data-act="report">完了を報告する</button>
    <button class="btn block ghost" data-act="lock-copy">誘い文をコピー</button>
  </div>
  <div class="quit" id="quit">やめる（3秒長押し）</div>
</div>

<nav class="tabs" aria-label="タブ">
  <button data-tab="reco" aria-label="アナタへのオススメ">
    <svg viewBox="0 0 24 24"><path d="M12 4v10"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
    <span class="badge" id="recoBadge" hidden></span>
  </button>
  <button data-tab="home" class="on" aria-label="ホーム">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
  </button>
  <button data-tab="friends" aria-label="友達">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
  </button>
  <button data-tab="settings" aria-label="設定">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
  </button>
</nav>
</div>

<script>
// ---------- 保存（この端末だけ） ----------
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('michi:' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('michi:' + k, JSON.stringify(v)); } catch {} },
};
let settings = store.get('settings', {});
let friends  = store.get('friends', []);          // [{name, lastMet, today}]
let result   = store.get('result', null);         // 直近の提案 {one_liner, proposals, mode}
let picked   = store.get('picked', null);         // 選んだ案の index
let lock     = store.get('lock', null);           // 進行中 {proposal, startedAt, durationMin, companion}
let history  = store.get('history', []);          // 完了・中断の記録
let focusIdx = 0;

const $ = (id) => document.getElementById(id);

// ---------- 日付・挨拶 ----------
(function header() {
  const d = new Date();
  $('today').textContent = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  renderHello();
})();
function renderHello() {
  const h = document.querySelector('h1.hello');
  h.firstChild.textContent = settings.name ? `Hello, ${settings.name}!` : 'Hello!';
}

// ---------- タブ ----------
document.querySelector('nav.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  showTab(b.dataset.tab);
});
function showTab(name) {
  for (const s of document.querySelectorAll('main > section')) s.hidden = s.id !== 'tab-' + name;
  for (const b of document.querySelectorAll('nav.tabs button')) b.classList.toggle('on', b.dataset.tab === name);
  if (name === 'reco') $('recoBadge').hidden = true;
  document.querySelector('main').scrollTop = 0;
}

// ---------- ホーム：生成 ----------
const quickForm = $('quickForm');
quickForm.elements.area.value = settings.homeArea || store.get('lastArea', '');
$('quickNote').textContent = settings.recent ? '' : '設定で「いつもの過ごし方」を書くと、提案が刺さります。';

quickForm.addEventListener('submit', (e) => { e.preventDefault(); generate(); });

async function generate() {
  const q = Object.fromEntries(new FormData(quickForm).entries());
  store.set('lastArea', q.area);
  const todayFriend = friends.find(f => f.today);
  const input = {
    area: q.area, minutes: q.minutes, mood: q.mood,
    budget: settings.budget || '', recent: settings.recent || '',
    companion: todayFriend ? todayFriend.name : (friends.length ? `友達リスト: ${friends.map(f => f.name).join('、')}` : ''),
  };
  setStatus('あなたが選ばない選択肢を探しています…');
  $('go').disabled = true;
  try {
    const res = await fetch('/api/suggest', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(input) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    result = data; picked = null; focusIdx = 0;
    store.set('result', result); store.set('picked', null);
    setStatus(data.mode === 'mock' ? '（モック表示：APIキー未設定）' : '');
    $('recoBadge').hidden = false;
    renderAll();
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $('go').disabled = false;
  }
}
function setStatus(msg, err = false) { const s = $('status'); s.textContent = msg; s.classList.toggle('err', err); }

// ---------- 描画 ----------
function renderAll() { renderFocus(); renderCards(); renderFriends(); }

function renderFocus() {
  const has = result && result.proposals?.length;
  $('quick').hidden = !!has;
  $('focus').hidden = !has;
  if (!has) return;
  const i = focusIdx;
  const p = result.proposals[i];
  $('focus').innerHTML = `
    <div class="kicker">今日の未知 ・ ${esc(result.one_liner)}</div>
    <div class="note" style="margin:0">「これにする」を押すと、完了までこのアプリから出られません。</div>
    <h3>${esc(p.title)}</h3>
    <div class="meta">${p.duration_min}分 ・ ${esc(p.cost_hint)} ・ ${esc(p.where_hint)}</div>
    <div class="why"><strong>なぜ自分では選ばないか:</strong> ${esc(p.why_you_wouldnt_pick)}</div>
    <dl class="kv">
      <dt>やること</dt><dd>${esc(p.what)}</dd>
      <dt>誰を誘う</dt><dd>${esc(p.invite_who)}</dd>
      <dt>最初の一歩</dt><dd>${esc(p.first_step)}</dd>
    </dl>
    <div class="actions">
      <button class="btn primary" data-act="pick" data-i="${i}">これにする</button>
      <button class="btn" data-act="next">別の案</button>
      <button class="btn" data-act="regen">もう一度</button>
    </div>
    <div class="dots">${result.proposals.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>`;
}

function renderCards() {
  const box = $('cards');
  $('oneliner').textContent = result?.one_liner || '';
  if (!result) return;
  box.innerHTML = result.proposals.map((p, i) => `
    <article class="card ${picked === i ? 'picked' : ''}">
      <div class="top"><h3>${esc(p.title)}</h3><span class="tag">${esc(p.category)}</span></div>
      <div class="meta" style="color:var(--sub);font-size:13px">${p.duration_min}分 ・ ${esc(p.cost_hint)} ・ ${esc(p.where_hint)}</div>
      <div class="why">${esc(p.why_you_wouldnt_pick)}</div>
      <dl class="kv"><dt>やること</dt><dd>${esc(p.what)}</dd><dt>動く感情</dt><dd>${esc(p.emotion)}</dd></dl>
      <div class="actions">
        <button class="btn primary" data-act="pick" data-i="${i}">${picked === i ? '選択中' : 'これにする'}</button>
        <button class="btn" data-act="copy" data-msg="${esc(p.invite_message)}">誘い文をコピー</button>
      </div>
    </article>`).join('');
}

function renderFriends() {
  $('friendCount').textContent = friends.length;
  const box = $('friends');
  if (!friends.length) { box.innerHTML = '<div class="empty">まだ誰もいません。まず1人、名前を追加してください。</div>'; return; }
  box.innerHTML = friends.map((f, i) => `
    <div class="friend ${f.today ? 'today' : ''}" data-i="${i}">
      <div class="avatar">${esc(f.name.slice(0, 1))}</div>
      <div class="grow">
        <div class="name">${esc(f.name)} ${f.today ? '<span class="tag">今日誘う</span>' : ''}</div>
        <div class="last">${f.lastMet ? '最後に会った日: ' + f.lastMet : 'まだ会っていない'}</div>
      </div>
      <button class="btn" data-act="met" data-i="${i}">会った</button>
      <button class="del" data-act="del" data-i="${i}" aria-label="削除">×</button>
    </div>`).join('');
}

// ---------- 操作 ----------
document.querySelector('main').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  const friendRow = e.target.closest('.friend');
  if (!b && friendRow) {                          // 友達の行タップ → 今日誘う人
    const i = +friendRow.dataset.i;
    friends = friends.map((f, k) => ({ ...f, today: k === i ? !f.today : false }));
    store.set('friends', friends); renderFriends(); return;
  }
  if (!b) return;
  const i = +b.dataset.i;
  switch (b.dataset.act) {
    case 'pick':   picked = i; store.set('picked', picked); startLock(i); break;
    case 'unpick': picked = null; store.set('picked', null); renderAll(); break;
    case 'next':   focusIdx = (focusIdx + 1) % result.proposals.length; renderFocus(); break;
    case 'regen':  result = null; picked = null; store.set('result', null); renderAll(); break;
    case 'copy':
      try { await navigator.clipboard.writeText(b.dataset.msg); b.textContent = 'コピーした'; }
      catch { prompt('コピーしてください', b.dataset.msg); }
      break;
    case 'met':    friends[i].lastMet = $('today').textContent; store.set('friends', friends); renderFriends(); break;
    case 'del':    friends.splice(i, 1); store.set('friends', friends); renderFriends(); break;
    case 'met-companion': {
      const f = friends.find(x => x.name === b.dataset.name);
      if (f) { f.lastMet = $('today').textContent; f.today = false; store.set('friends', friends); }
      b.textContent = '記録した'; b.disabled = true; renderFriends(); break;
    }
    case 'go-home': showTab('home'); break;
  }
});

$('addFriend').addEventListener('click', () => {
  const name = $('newFriend').value.trim(); if (!name) return;
  friends.push({ name, lastMet: null, today: false }); store.set('friends', friends);
  $('newFriend').value = ''; renderFriends();
});
$('newFriend').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('addFriend').click(); } });

// ---------- 設定 ----------
const sf = $('settingsForm');
for (const [k, v] of Object.entries(settings)) if (sf.elements[k]) sf.elements[k].value = v;
sf.addEventListener('submit', (e) => {
  e.preventDefault();
  settings = Object.fromEntries(new FormData(sf).entries());
  store.set('settings', settings);
  renderHello();
  if (settings.homeArea && !quickForm.elements.area.value) quickForm.elements.area.value = settings.homeArea;
  $('quickNote').textContent = '';
  $('mode').textContent = '保存しました。';
  setTimeout(() => showMode(), 1200);
});
async function showMode() {
  try { const h = await (await fetch('/api/health')).json();
    $('mode').textContent = `生成モード: ${h.mode === 'live' ? 'ライブ（' + h.model + '）' : 'モック（APIキー未設定）'}`; } catch {}
}
showMode();

// ---------- ロック ----------
function startLock(i) {
  const p = result.proposals[i];
  const todayFriend = friends.find(f => f.today);
  lock = { proposal: p, startedAt: Date.now(), durationMin: p.duration_min || 60, companion: todayFriend?.name || null };
  store.set('lock', lock);
  renderLock();
}
let tick = null;
function renderLock() {
  const el = $('lock');
  el.hidden = !lock;
  document.querySelector('nav.tabs').hidden = !!lock;
  clearInterval(tick);
  if (!lock) return;
  $('lockDate').textContent = $('today').textContent;
  $('lockTitle').textContent = lock.proposal.title;
  $('lockStep').textContent = '最初の一歩: ' + lock.proposal.first_step;
  $('report').hidden = true; $('lockActions').hidden = false;
  const update = () => {
    const remain = lock.durationMin * 60000 - (Date.now() - lock.startedAt);
    const t = $('lockTimer');
    if (remain > 0) {
      const m = Math.floor(remain / 60000), s = Math.floor((remain % 60000) / 1000);
      t.textContent = `${m}:${String(s).padStart(2, '0')}`; t.classList.remove('over');
      $('lockCap').textContent = '残り時間 — 終わるまでこの画面から出られません';
    } else {
      t.textContent = '時間です。'; t.classList.add('over');
      $('lockCap').textContent = '完了を報告して、スマホを取り戻してください';
    }
  };
  update(); tick = setInterval(update, 1000);
}
function finishLock(status, note, photo) {
  const minutes = Math.max(1, Math.round((Date.now() - lock.startedAt) / 60000));
  history.push({ date: $('today').textContent, title: lock.proposal.title, status, minutes, companion: lock.companion, note: note || '', photo: photo || null });
  store.set('history', history);
  const finished = lock; lock = null; store.set('lock', null);
  picked = null; store.set('picked', null);
  renderLock(); renderAll();
  if (status === 'done') renderDone(finished, minutes); else showTab('home');
}
function renderDone(finished, minutes) {
  const doneCount = history.filter(h => h.status === 'done').length;
  const streak = calcStreak();
  const last = history[history.length - 1];
  $('tab-done').innerHTML = `
    <div class="date">${$('today').textContent}</div>
    <h1>おかえり。</h1>
    <p class="sub">未知を1つ、現実にした。</p>
    <div class="card">
      <h3 style="margin:0">${esc(finished.proposal.title)}</h3>
      <div class="meta" style="color:var(--sub);font-size:13px">所要 ${minutes}分${finished.companion ? ' ・ 一緒に: ' + esc(finished.companion) : ''}</div>
      ${last.photo ? `<img src="${last.photo}" alt="報告写真" style="max-width:100%;border-radius:10px">` : ''}
      ${last.note ? `<div>${esc(last.note)}</div>` : ''}
    </div>
    <div class="stats">
      <div class="stat"><b>${doneCount}</b><span>未知</span></div>
      <div class="stat"><b>${friends.filter(f => f.lastMet).length}</b><span>/ 100人 会った</span></div>
      <div class="stat"><b>${streak}</b><span>連続日</span></div>
    </div>
    <div class="actions">
      ${finished.companion ? `<button class="btn primary" data-act="met-companion" data-name="${esc(finished.companion)}">${esc(finished.companion)}に会ったと記録する</button>` : ''}
      <button class="btn" data-act="go-home">ホームへ</button>
    </div>`;
  for (const s of document.querySelectorAll('main > section')) s.hidden = s.id !== 'tab-done';
  for (const b of document.querySelectorAll('nav.tabs button')) b.classList.remove('on');
}
function calcStreak() {
  const days = new Set(history.filter(h => h.status === 'done').map(h => h.date));
  let n = 0; const d = new Date();
  while (days.has(`${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`)) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
let photoData = null;
$('reportPhoto').addEventListener('change', (e) => {
  const f = e.target.files?.[0]; if (!f) { photoData = null; return; }
  const r = new FileReader();
  r.onload = () => { photoData = r.result; $('reportPreview').src = photoData; $('reportPreview').hidden = false; };
  r.readAsDataURL(f);
});
$('lock').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  switch (b.dataset.act) {
    case 'report': $('report').hidden = false; $('lockActions').hidden = true; break;
    case 'report-cancel': $('report').hidden = true; $('lockActions').hidden = false; break;
    case 'finish': finishLock('done', $('reportNote').value.trim(), photoData); photoData = null; $('reportNote').value = ''; $('reportPreview').hidden = true; break;
    case 'lock-copy':
      try { await navigator.clipboard.writeText(lock.proposal.invite_message); b.textContent = 'コピーした'; }
      catch { prompt('コピーしてください', lock.proposal.invite_message); }
      break;
  }
});
// やめる: 3秒長押しだけ受け付ける（誤タップで抜けられないように）
(function quitHold() {
  const q = $('quit'); let timer = null;
  const arm = (e) => { e.preventDefault(); q.classList.add('arming'); q.textContent = 'そのまま押し続ける…';
    timer = setTimeout(() => { finishLock('quit'); reset(); }, 3000); };
  const reset = () => { clearTimeout(timer); q.classList.remove('arming'); q.textContent = 'やめる（3秒長押し）'; };
  for (const ev of ['pointerdown']) q.addEventListener(ev, arm);
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) q.addEventListener(ev, reset);
})();

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
renderAll();
renderLock();
</script>
</body>
</html>
