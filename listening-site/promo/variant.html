<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ひだまり傾聴室 テーマ別ショート動画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* 1080×1920（縦型）。record-variants.mjs が ?v=番号 で開き、1コマずつ撮影する */
  :root { --bg: #fbf7f1; --ink: #3b3530; --ink-soft: #6f655c; --accent: #d98a5f; --accent-deep: #b86a41; --peach: #f8d9c3; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; color: var(--ink); }
  .serif { font-family: "Shippori Mincho", "Yu Mincho", serif; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(900px 900px at 85% 8%, #f6d3b8 0%, transparent 60%),
                radial-gradient(800px 800px at 5% 95%, #d8e4d6 0%, transparent 60%), var(--bg); }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 260px 60px 380px; gap: 40px; opacity: 0; animation: scene var(--dur) linear var(--start) both; }
  .scene.last { animation-name: sceneLast; }
  @keyframes scene { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes sceneLast { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 1; } }
  .in { opacity: 0; animation: rise 1s cubic-bezier(.2,.7,.2,1) calc(var(--start) + var(--d, 0s)) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  .big { font-size: 92px; line-height: 1.5; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
  .big em { font-style: normal; background: linear-gradient(transparent 64%, var(--peach) 64%); }
  .mid { font-size: 54px; white-space: nowrap; line-height: 1.8; color: var(--ink-soft); }
  .word { font-size: 120px; font-weight: 700; color: var(--accent-deep); }
  .word s { text-decoration-thickness: 10px; text-decoration-color: rgba(59, 53, 48, .55); }
  .chip { font-size: 50px; white-space: nowrap; font-weight: 700; background: #fff; border-radius: 999px; padding: 24px 60px; box-shadow: 0 16px 40px rgba(120, 90, 60, .12); }
  .mark { width: 200px; height: 200px; }
  .brand { font-size: 108px; letter-spacing: .04em; white-space: nowrap; }
  .tagline { font-size: 52px; line-height: 1.7; color: var(--ink-soft); }
  .cta { font-size: 48px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 30px 56px; white-space: nowrap; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<template id="ending">
  <section class="scene last">
    <svg class="mark in" style="--d: .2s" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="15" fill="#fdebdf"/><circle cx="16" cy="13" r="6" fill="#d98a5f"/>
      <path d="M6 24c3-3 6.5-4.5 10-4.5S23 21 26 24" stroke="#7f9c85" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </svg>
    <p class="brand serif in" style="--d: .5s">ひだまり傾聴室</p>
    <p class="tagline in" style="--d: .9s">匿名OK・電話/オンライン<br>初回30分 1,000円</p>
    <p class="cta in" style="--d: 1.4s">プロフィールのリンクから予約</p>
  </section>
</template>
<script>
  // 各動画のシーン（HTML, 長さ秒）。最後に共通のエンディング（4秒）が付く
  const VARIANTS = [
    // 1. 傾聴で言わない3つの言葉
    [
      ['<p class="big serif in" style="--d:.2s">相談して、<br>かえって<br><em>つらくなったこと、</em><br>ありませんか。</p>', 4.2],
      ['<p class="mid in" style="--d:.1s">傾聴で、絶対に言わない言葉</p><p class="word serif in" style="--d:.7s"><s>「でも」</s></p><p class="word serif in" style="--d:1.3s"><s>「普通は」</s></p><p class="word serif in" style="--d:1.9s"><s>「私だったら」</s></p>', 4.6],
      ['<p class="big serif in" style="--d:.2s">否定せずに、<br><em>ただ聴きます。</em></p>', 3.4],
    ],
    // 2. 日曜の夜・仕事のしんどさ
    [
      ['<p class="big serif in" style="--d:.2s">日曜の夜、<br>明日を思うと<br><em>気持ちが重たい。</em></p>', 4.2],
      ['<p class="chip in" style="--d:.2s">職場の人には言えない</p><p class="chip in" style="--d:.8s">家族には心配をかけたくない</p><p class="mid in" style="--d:1.6s">だから、ひとりで抱える。</p>', 4.6],
      ['<p class="big serif in" style="--d:.2s">その「ひとり」を<br><em>少しだけ手放す</em><br>30分を。</p>', 3.6],
    ],
    // 3. 初めての方へ
    [
      ['<p class="big serif in" style="--d:.2s">何を話せばいいか<br>分からなくても、<br><em>大丈夫です。</em></p>', 4.2],
      ['<p class="chip in" style="--d:.2s">ニックネームでOK</p><p class="chip in" style="--d:.7s">顔出しなし・電話でもOK</p><p class="chip in" style="--d:1.2s">話したくないことは、話さなくていい</p>', 4.6],
      ['<p class="mid in" style="--d:.2s">アドバイスも、お説教もしません。</p><p class="big serif in" style="--d:1s"><em>ただ、聴きます。</em></p>', 3.6],
    ],
  ];
  const v = Number(new URLSearchParams(location.search).get('v') || 1) - 1;
  const stage = document.getElementById('stage');
  let t = 0;
  for (const [html, dur] of VARIANTS[v]) {
    const s = document.createElement('section');
    s.className = 'scene';
    s.style.cssText = `--start:${t}s;--dur:${dur + 0.2}s`;
    s.innerHTML = html;
    stage.appendChild(s);
    t += dur;
  }
  const end = document.getElementById('ending').content.firstElementChild.cloneNode(true);
  end.style.cssText = `--start:${t}s;--dur:4s`;
  stage.appendChild(end);
  window.TOTAL = t + 4;
</script>
</body>
</html>
