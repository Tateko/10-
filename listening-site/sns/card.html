<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ひだまり傾聴室 投稿用画像カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
  /* 1080×1350（4:5）。X・Threads・Instagramで共通に使えるサイズ。
     render-card.mjs が ?d=（JSONをURLエンコード）で内容を渡して撮影する */
  :root { --bg: #fbf7f1; --ink: #3b3530; --ink-soft: #6f655c; --accent: #d98a5f; --deep: #b86a41; --leaf: #7f9c85; --peach: #f8d9c3; --cream: #f4ede2; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; color: var(--ink); background: var(--bg); }
  .card { width: 1080px; height: 1350px; display: grid; grid-template-rows: 620px 1fr auto; padding: 70px 80px 56px;
    background: radial-gradient(700px 600px at 92% 0%, #f6d3b8 0%, transparent 62%), radial-gradient(600px 500px at 0% 100%, #dfe8dc 0%, transparent 60%), var(--bg); }
  .card.night { background: radial-gradient(700px 600px at 85% 0%, #5b6b8a 0%, transparent 65%), linear-gradient(#3e4762, #2f3548); color: #f4ede2; }
  .card.night .sub, .card.night .foot { color: #cfd4e2; }
  .card.night .title em { background: linear-gradient(transparent 62%, rgba(217, 138, 95, .55) 62%); }
  .illus { display: grid; place-items: center; }
  .illus svg { width: 620px; height: 560px; }
  .text { display: flex; flex-direction: column; justify-content: center; gap: 26px; text-align: center; }
  .title { font-family: "Shippori Mincho", "Yu Mincho", serif; font-size: 66px; line-height: 1.55; letter-spacing: .04em; font-weight: 600; text-wrap: balance; }
  .title em { font-style: normal; background: linear-gradient(transparent 62%, var(--peach) 62%); }
  .sub { font-size: 36px; line-height: 1.7; color: var(--ink-soft); }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: var(--ink-soft); padding-top: 26px; border-top: 2px solid rgba(184, 106, 65, .18); }
  .foot b { font-family: "Shippori Mincho", serif; font-size: 34px; color: inherit; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="illus" id="illus"></div>
  <div class="text"><p class="title" id="title"></p><p class="sub" id="sub"></p></div>
  <div class="foot"><b>ひだまり傾聴室</b><span>@hidamari_keicho</span></div>
</div>

<!-- イラスト（すべてブランド色のフラットな図形）。id を d.illus に指定する -->
<template id="moon"><!-- 夜の窓と月、湯気の立つマグ -->
  <svg viewBox="0 0 620 560"><rect x="110" y="40" width="400" height="360" rx="28" fill="#4c5774"/><rect x="110" y="40" width="400" height="360" rx="28" fill="none" stroke="#f4ede2" stroke-width="14"/>
  <line x1="310" y1="40" x2="310" y2="400" stroke="#f4ede2" stroke-width="12"/><line x1="110" y1="220" x2="510" y2="220" stroke="#f4ede2" stroke-width="12"/>
  <circle cx="420" cy="130" r="52" fill="#f8d9c3"/><circle cx="398" cy="114" r="52" fill="#4c5774"/>
  <circle cx="190" cy="110" r="6" fill="#f4ede2"/><circle cx="240" cy="170" r="4" fill="#f4ede2"/><circle cx="370" cy="300" r="5" fill="#f4ede2"/>
  <rect x="60" y="420" width="500" height="26" rx="13" fill="#b86a41"/>
  <path d="M250 330h120v70a30 30 0 0 1-30 30h-60a30 30 0 0 1-30-30z" fill="#d98a5f"/><path d="M370 345a28 28 0 0 1 0 56" fill="none" stroke="#d98a5f" stroke-width="14"/>
  <path d="M285 310c-14-20 14-30 0-52M325 310c-14-20 14-30 0-52" fill="none" stroke="#f4ede2" stroke-width="8" stroke-linecap="round" opacity=".8"/></svg>
</template>
<template id="cups"><!-- 向かい合う2つのカップ（話を聴く時間） -->
  <svg viewBox="0 0 620 560"><ellipse cx="310" cy="440" rx="270" ry="40" fill="#f4ede2"/>
  <path d="M110 250h150v120a40 40 0 0 1-40 40h-70a40 40 0 0 1-40-40z" fill="#d98a5f"/><path d="M260 275a34 34 0 0 1 0 68" fill="none" stroke="#d98a5f" stroke-width="16"/>
  <path d="M360 250h150v120a40 40 0 0 1-40 40h-70a40 40 0 0 1-40-40z" fill="#7f9c85"/><path d="M360 275a34 34 0 0 0 0 68" fill="none" stroke="#7f9c85" stroke-width="16"/>
  <path d="M160 225c-16-24 16-36 0-62M210 225c-16-24 16-36 0-62M410 225c-16-24 16-36 0-62M460 225c-16-24 16-36 0-62" fill="none" stroke="#e7c3a8" stroke-width="9" stroke-linecap="round"/>
  <path d="M290 120c0-26 40-26 40 0 0-26 40-26 40 0 0 34-40 50-40 62 0-12-40-28-40-62z" fill="#f8d9c3" transform="translate(-20 -40)"/></svg>
</template>
<template id="bench"><!-- 木の下のベンチ（ひとやすみ） -->
  <svg viewBox="0 0 620 560"><ellipse cx="310" cy="470" rx="290" ry="40" fill="#dfe8dc"/>
  <rect x="400" y="190" width="30" height="280" rx="12" fill="#b86a41"/><circle cx="415" cy="160" r="120" fill="#7f9c85"/><circle cx="340" cy="210" r="80" fill="#93ad98"/><circle cx="490" cy="220" r="76" fill="#93ad98"/>
  <rect x="80" y="350" width="300" height="24" rx="10" fill="#d98a5f"/><rect x="80" y="300" width="300" height="22" rx="10" fill="#d98a5f"/>
  <rect x="100" y="374" width="18" height="90" rx="8" fill="#b86a41"/><rect x="342" y="374" width="18" height="90" rx="8" fill="#b86a41"/>
  <circle cx="150" cy="90" r="40" fill="#f8d9c3"/></svg>
</template>
<template id="bubbles"><!-- ふたつの吹き出し（言葉・会話） -->
  <svg viewBox="0 0 620 560"><path d="M60 90a50 50 0 0 1 50-50h280a50 50 0 0 1 50 50v130a50 50 0 0 1-50 50H190l-70 60 10-60h-20a50 50 0 0 1-50-50z" fill="#fff" stroke="#e7ddcf" stroke-width="6"/>
  <rect x="120" y="110" width="220" height="22" rx="11" fill="#e7ddcf"/><rect x="120" y="160" width="160" height="22" rx="11" fill="#e7ddcf"/>
  <path d="M200 300a50 50 0 0 1 50-50h260a50 50 0 0 1 50 50v110a50 50 0 0 1-50 50h-10l10 60-70-60H250a50 50 0 0 1-50-50z" fill="#fdebdf"/>
  <path d="M330 330c0-24 36-24 36 0 0-24 36-24 36 0 0 30-36 46-36 56 0-10-36-26-36-56z" fill="#d98a5f"/></svg>
</template>
<template id="sprout"><!-- 鉢の芽（小さな一歩） -->
  <svg viewBox="0 0 620 560"><circle cx="460" cy="120" r="70" fill="#f8d9c3"/>
  <path d="M310 380V230" stroke="#7f9c85" stroke-width="16" stroke-linecap="round"/>
  <path d="M310 270c-10-70-80-90-140-80 10 60 60 100 140 80z" fill="#93ad98"/><path d="M310 240c10-70 80-90 140-80-10 60-60 100-140 80z" fill="#7f9c85"/>
  <path d="M190 370h240l-30 140H220z" fill="#d98a5f"/><rect x="175" y="350" width="270" height="40" rx="14" fill="#b86a41"/></svg>
</template>
<template id="sunrise"><!-- 丘から昇る朝日（明日・はじまり） -->
  <svg viewBox="0 0 620 560"><circle cx="310" cy="330" r="130" fill="#f8d9c3"/><circle cx="310" cy="330" r="96" fill="#d98a5f"/>
  <g stroke="#e7c3a8" stroke-width="12" stroke-linecap="round"><path d="M310 150v-50M150 230l-36-30M470 230l36-30M110 350H60M510 350h50"/></g>
  <path d="M0 400c120-60 240-70 330-30s200 40 290 0v160H0z" fill="#7f9c85"/><path d="M0 450c140-40 260-30 360 0s180 20 260 0v110H0z" fill="#93ad98"/></svg>
</template>

<script>
  // d = { title: "改行は\\n、強調は*〜*", sub: "補足（任意）", illus: "moon|cups|bench|bubbles|sprout|sunrise", night: true/false }
  const d = JSON.parse(new URLSearchParams(location.search).get("d") || '{"title":"誰にも言えない話を、\\n*否定せずに*聴きます。","sub":"仕事・恋愛・お金のこと","illus":"cups"}');
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rich = (s) => esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/\n/g, "<br>");
  document.getElementById("title").innerHTML = rich(d.title);
  document.getElementById("sub").innerHTML = d.sub ? rich(d.sub) : "";
  document.getElementById("illus").appendChild(document.getElementById(d.illus || "cups").content.cloneNode(true));
  if (d.night) document.getElementById("card").classList.add("night");
</script>
</body>
</html>
